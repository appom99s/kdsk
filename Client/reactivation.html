<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Factures et sécurité · KADOSK</title><link rel="stylesheet" href="assets/client-utilities.css"><link rel="stylesheet" href="../shared/assets/ui-system.css">
</head><body><main><a class="brand" href="index.html">KADOSK</a><h1>Réactiver votre carte</h1><p>Après un blocage de sécurité, vérifiez le code permanent et le PIN de la carte, puis confirmez le code envoyé à son adresse e-mail.</p><p>Une carte suspendue par l’administration, expirée ou épuisée ne peut pas être réactivée ici.</p>
<form id="reactivate"><label for="code">Code permanent de la carte</label><input id="code" autocomplete="off" maxlength="80" required><label for="pin">PIN à 6 chiffres</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" pattern="[0-9]{6}" maxlength="6" required><button id="request">Recevoir le code de réactivation</button>
<div id="confirmation" hidden><label for="otp">Code reçu par e-mail</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><button type="button" id="confirm">Confirmer la réactivation</button></div></form><p id="status" role="status"></p></main><script src="assets/config.js"></script><script src="assets/auth.js"></script><script src="assets/api.js"></script><script src="assets/reactivation.js"></script></body></html>
