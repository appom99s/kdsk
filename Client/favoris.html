<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mes favoris — KADOSK</title>
<link rel="stylesheet" href="assets/kadosk2.css" />
<link rel="stylesheet" href="assets/client-shell.css" />
<link rel="stylesheet" href="../shared/assets/ui-system.css" />
<link rel="stylesheet" href="assets/mobile-reference.css" />
<link rel="stylesheet" href="assets/reading-comfort.css">
<script defer src="assets/reading-comfort.js"></script>
</head>
<body class="k2-body">
  <div class="k2-topbar">
    <a href="boutique-client.html" class="k2-logo">
      <img src="assets/logo.png" alt="KADOSK" />
    </a>
    <div class="k2-entete-actions">
      <a href="favoris.html" class="k2-icone-action" aria-label="Mes favoris">
        <span id="iconeFavorisHeader"></span>
        <span class="k2-icone-badge" data-favoris-badge style="display:none;">0</span>
      </a>
      <a href="etape-3-recap.html" class="k2-icone-action" aria-label="Mon panier">
        <span id="iconePanierHeader"></span>
        <span class="k2-icone-badge" data-panier-badge style="display:none;">0</span>
      </a>
    </div>
  </div>

  <div class="k2-shop-header-search-row">
    <form class="k2-shop-header-search" action="commercants.html" method="get" role="search">
      <div class="k2-filtre-recherche">
        <span id="iconeRechercheHeaderTop"></span>
        <input type="search" name="q" placeholder="Rechercher un commerçant, une enseigne…" autocomplete="off" />
      </div>
      <button type="submit" class="k2-btn k2-btn-primaire">Rechercher</button>
    </form>
  </div>
  <nav class="k2-shop-header-categories" id="pillsCategoriesHeader" aria-label="Catégories"></nav>

  <main class="k2-main">
    <h1 class="k2-sous-titre" style="text-align:left;">Mes favoris</h1>
    <p style="font-size:13px;color:var(--k2-texte-clair);margin:-14px 0 20px;">
      Enregistrés sur cet appareil — <span id="texteNombreFavoris">0</span> enseigne(s).
    </p>

    <div id="etatChargement" class="k2-etat-chargement"><div class="k2-spinner"></div><br />Chargement...</div>
    <div id="etatVide" class="k2-etat" style="display:none">
      <span id="k2IconeCoeurVide"></span><br />
      Vous n'avez pas encore d'enseigne favorite.<br />
      <a href="boutique-client.html" style="color:var(--k2-primary);font-weight:700;">Découvrir les cartes cadeaux</a>
    </div>

    <div id="grilleFavoris" class="k2-grille-cartes"></div>
  </main>


  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/header-icons.js"></script>
  <script src="assets/nav2.js"></script>
  <script src="assets/shop-header-search.js"></script>
  <script src="assets/panier2.js"></script>
  <script src="assets/favoris-data.js"></script>
  <script src="assets/cache.js"></script>
  <script src="assets/favoris.js"></script>
  <script src="assets/client-shell.js"></script>
  <script src="assets/wix-nav-bridge.js"></script>
  <script src="assets/wix-iframe-resize.js"></script>
<script src="../shared/assets/ui-system.js"></script>
</body>
</html>
