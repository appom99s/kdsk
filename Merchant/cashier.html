<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>KADOSK Marchand — Encaisser</title>
<link rel="stylesheet" href="assets/style.css" />
<link rel="stylesheet" href="../shared/assets/ui-system.css" />
<link rel="stylesheet" href="../shared/assets/card-experience.css">
<link rel="stylesheet" href="../shared/assets/release-polish.css">
</head>
<body>
  <div class="kadosk-app">
    <aside class="kadosk-sidebar" id="kadoskSidebar"></aside>

    <main class="kadosk-main">
      <div class="kadosk-entete">
        <h1>Encaisser</h1>
        <div id="kadoskEnteteDroite" class="kadosk-entete-droite"></div>
      </div>

      <div class="kadosk-panneau-large" style="max-width:520px;">
        <!-- Encaissement uniquement par code permanent + PIN du client (plus de QR temporaire). -->
        <div class="kd-champ">
          <label class="kd-obligatoire" for="champCode">Code de la carte</label>
          <input type="text" id="champCode" placeholder="KDSK-XXXX-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" />
        </div>
        <div class="kadosk-ligne-boutons">
          <button type="button" class="kadosk-bouton kadosk-bouton-secondaire" id="boutonRechercher">Rechercher</button>
        </div>

        <div class="kadosk-carte-info" id="carteInfo" style="display:none;"></div>

        <div id="blocMontant" style="display:none; margin-top:16px;">
          <div class="kd-champ">
            <label for="champPointVente">Point de vente</label>
            <select id="champPointVente"></select>
          </div>
          <div class="kd-champ" style="margin-top:14px;">
            <label class="kd-obligatoire" for="champMontant">Montant à encaisser (DH)</label>
            <input type="text" id="champMontant" inputmode="decimal" autocomplete="off" />
          </div>
        </div>

        <!-- Pavé numérique tactile : visible uniquement sur mobile (voir style.css). -->
        <div class="kadosk-pave-numerique" id="paveNumerique" style="display:none;">
          <button type="button" class="kadosk-touche-pave" data-touche="1">1</button>
          <button type="button" class="kadosk-touche-pave" data-touche="2">2</button>
          <button type="button" class="kadosk-touche-pave" data-touche="3">3</button>
          <button type="button" class="kadosk-touche-pave" data-touche="4">4</button>
          <button type="button" class="kadosk-touche-pave" data-touche="5">5</button>
          <button type="button" class="kadosk-touche-pave" data-touche="6">6</button>
          <button type="button" class="kadosk-touche-pave" data-touche="7">7</button>
          <button type="button" class="kadosk-touche-pave" data-touche="8">8</button>
          <button type="button" class="kadosk-touche-pave" data-touche="9">9</button>
          <button type="button" class="kadosk-touche-pave" data-touche=",">,</button>
          <button type="button" class="kadosk-touche-pave" data-touche="0">0</button>
          <button type="button" class="kadosk-touche-pave kadosk-touche-pave-effacer" id="toucheEffacerPave" aria-label="Effacer un chiffre">⌫</button>
        </div>

        <div class="kd-champ" id="blocPin" style="display:none; margin-top:14px;">
          <label class="kd-obligatoire" for="champPin">PIN du client (6 chiffres)</label>
          <input type="password" id="champPin" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" class="pin-input" />
          <span class="kd-aide">Le client saisit lui-même son PIN. Après 5 erreurs la carte est bloquée.</span>
        </div>

        <div class="kadosk-ligne-boutons" id="blocBoutonEncaisser" style="display:none; margin-top:12px;">
          <button type="button" class="kadosk-bouton" id="boutonEncaisser">Encaisser</button>
        </div>

        <div class="kadosk-message-erreur" id="messageStatutEncaissement" role="status" aria-live="polite"></div>
      </div>

      <div class="kadosk-panneau-large" style="max-width:520px; margin-top:20px;">
        <h2>Mes dernières transactions</h2>
        <div id="listeTransactionsCashier"><div class="kadosk-liste-vide">Chargement…</div></div>
      </div>
    </main>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/cache.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/guard.js"></script>
  <script src="assets/spa.js"></script>
  <script src="../shared/assets/secure-card-ui.js"></script>
<script src="assets/cashier.js"></script>
<script src="../shared/assets/ui-system.js"></script>
</body>
</html>
